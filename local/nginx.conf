# LOCAL-ONLY static server for the walking slice (C9 headers; NFR15.1).
# It serves the `public` relative link in the read-only `site` volume. Every header is
# declared once at server level with `always`, and no location declares its own add_header
# (which would discard the inherited ones), so 404 responses carry the headers too.
# HSTS is omitted: this local server is plain http (C9 sets HSTS in production).

map $uri $slice_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/media/   "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /srv/site/public;
    disable_symlinks off;
    server_tokens off;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $slice_cache_control always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/index.html =404;
    }
}
